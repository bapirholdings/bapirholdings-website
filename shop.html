<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Bapir Holdings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo-container">
                <img src="images/logo3.jpeg" alt="Bapir Holdings Logo" class="logo">
                <span class="logo-text">BAPIR HOLDINGS</span>
            </a>
            <div class="nav-center">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="shop-container">
        <h1>Bapir Holdings Catalog</h1>
        
        <div class="product-grid">
            <div class="product-card">
                <img src="images/item1.jpg" alt="Product Name" class="product-image">
                <div class="product-info">
                    <h3>Standard Product</h3>
                    <p class="price">$100.00</p>
                    <a href="YOUR_CHASE_LINK_HERE" class="btn-checkout">Buy Now</a>
                </div>
            </div>

            <div class="product-card sale-item">
                <div class="sale-badge">SALE</div>
                <img src="images/item2.jpg" alt="Sale Product" class="product-image">
                <div class="product-info">
                    <h3>Clearance Item</h3>
                    <p class="price">
                        <span class="sale-price">$75.00</span> 
                        <span class="original-price">$120.00</span>
                    </p>
                    <a href="YOUR_CHASE_SALE_LINK_HERE" class="btn-checkout">Claim Deal</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-left">
                <p>&copy; 2026 Bapir Holdings LLC. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <p><strong>Support:</strong> bapirholdings@icloud.com</p>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
