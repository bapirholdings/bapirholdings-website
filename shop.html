<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Bapir Holdings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo-container">
                <img src="images/logo3.jpeg" alt="Bapir Holdings Logo" class="logo">
                <span class="logo-text">BAPIR HOLDINGS</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <div class="shop-container">
        <h1>Our Collection</h1>
        <div class="product-grid">
            <div class="product-card">
                <img src="images/product1.jpg" alt="Product 1" class="product-image">
                <div class="product-info">
                    <h3>Elite Service Package</h3>
                    <p class="price">$150.00</p>
                    <a href="https://checkout.chase.com/your-unique-link" class="btn-checkout">Buy Now</a>
                    </div>
            </div>

            <div class="product-card">
                <img src="images/product2.jpg" alt="Product 2" class="product-image">
                <div class="product-info">
                    <h3>Premium Membership</h3>
                    <p class="price">
                        <span class="sale-price">$80.00</span> 
                        <span class="original-price">$100.00</span>
                    </p>
                    <a href="https://checkout.chase.com/your-sale-link" class="btn-checkout">Buy Now</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
